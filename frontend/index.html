<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#111315" />
    <script>
      // Apply saved preferences before styles and React load to avoid a flash.
      try {
        const theme = localStorage.getItem('rag-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = localStorage.getItem('rag-lang') === 'en' ? 'en' : 'zh-CN';
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#15181c' : '#f5f5f5';
      } catch {}
    </script>
    <title>致知｜可追溯资料问答</title>
  </head>
  <body class="h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
